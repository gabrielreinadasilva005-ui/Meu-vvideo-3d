<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Túnel Neon 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #020008; }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020008, 0.035);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // Anéis do túnel neon
    const rings = [];
    const ringCount = 25;
    const spacing = 2.5;
    const colors = [0x00ffff, 0xff00ff, 0x7700ff];

    for (let i = 0; i < ringCount; i++) {
      const geometry = new THREE.TorusGeometry(3.2, 0.04, 8, 6);
      const material = new THREE.MeshBasicMaterial({ 
        color: colors[i % colors.length] 
      });
      const ring = new THREE.Mesh(geometry, material);
      ring.position.z = -i * spacing;
      ring.rotation.z = i * 0.2;
      scene.add(ring);
      rings.push(ring);
    }

    // Estrelas voando
    const starGeo = new THREE.BufferGeometry();
    const starCount = 600;
    const starPositions = new Float32Array(starCount * 3);

    for (let i = 0; i < starCount * 3; i += 3) {
      starPositions[i] = (Math.random() - 0.5) * 20;
      starPositions[i + 1] = (Math.random() - 0.5) * 20;
      starPositions[i + 2] = -Math.random() * (ringCount * spacing);
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.06 });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      rings.forEach((ring, index) => {
        ring.position.z += 0.18;
        ring.rotation.z += 0.01 * (index % 2 === 0 ? 1 : -1);

        if (ring.position.z > 6) {
          ring.position.z = -(ringCount - 1) * spacing + 6;
        }
      });

      const positions = stars.geometry.attributes.position.array;
      for (let i = 2; i < starCount * 3; i += 3) {
        positions[i] += 0.35;
        if (positions[i] > 6) {
          positions[i] = -(ringCount * spacing);
        }
      }
      stars.geometry.attributes.position.needsUpdate = true;

      camera.position.x = Math.sin(elapsedTime * 1.2) * 0.35;
      camera.position.y = Math.cos(elapsedTime * 0.9) * 0.35;
      camera.lookAt(0, 0, -10);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
